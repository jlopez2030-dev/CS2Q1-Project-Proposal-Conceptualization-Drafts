<!DOCTYPE html>
<html>
<head>
  <title>Multi-Tool Study Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Multi-Tool Study Assistant</h1>

<!-- UNIT CONVERTER -->
<h2>Unit Converter</h2>
<input type="number" id="value" placeholder="Value">

<select id="from">
  <option value="m">m</option>
  <option value="cm">cm</option>
  <option value="km">km</option>
  <option value="kg">kg</option>
  <option value="g">g</option>
  <option value="l">l</option>
  <option value="ml">ml</option>
</select>

<select id="to">
  <option value="cm">cm</option>
  <option value="m">m</option>
  <option value="km">km</option>
  <option value="g">g</option>
  <option value="kg">kg</option>
  <option value="ml">ml</option>
  <option value="l">l</option>
</select>

<br>
<button onclick="convert('length')">Convert Length</button>
<button onclick="convert('weight')">Convert Weight</button>
<button onclick="convert('capacity')">Convert Capacity</button>

<p id="output"></p>

<hr>

<!-- CALCULATOR -->
<h2>Calculator</h2>
<input id="num1" type="number">
<input id="num2" type="number">

<button onclick="calculate('+')">+</button>
<button onclick="calculate('-')">−</button>
<button onclick="calculate('*')">×</button>
<button onclick="calculate('/')">÷</button>

<p id="calcResult"></p>

<hr>

<!-- TO-DO LIST -->
<h2>To-Do List</h2>
<input id="taskInput" placeholder="New task">
<button onclick="addTask()">Add</button>
<ul id="taskList"></ul>

<hr>

<!-- TIMER -->
<h2>Timer</h2>
<input id="seconds" type="number" placeholder="Seconds">
<button onclick="startTimer()">Start</button>
<p id="timer"></p>

<script src="script.js"></script>
</body>
</html>
